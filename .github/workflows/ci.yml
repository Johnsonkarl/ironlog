
name: IronLog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest tests/test_app.py tests/test_api.py -v
  
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run security scan
        run: python -m bandit -r app.py api.py
  
  
  docker:
    name: Build and Test Docker Image
    needs: [test, security, dependency_scan]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ironlog:ci .

      - name: Test containerized API
        run: |
          docker run -d --name ironlog-ci -p 127.0.0.1:5000:5000 ironlog:ci

          trap 'docker logs ironlog-ci 2>&1 || true; docker rm -f ironlog-ci' EXIT
          
          for attempt in {1..15}; do
              if curl --fail --silent --output /dev/null \
                  --max-time 2 \
                  http://127.0.0.1:5000/health; then

                  echo "IronLog is ready!"
                  break
              fi

              if [ "$attempt" -eq 15 ]; then
                  echo "IronLog failed to become ready."
                  docker logs ironlog-ci
                  exit 1
              fi

              sleep 1
          done





          

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:5000/health

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"weight":225,"reps":5}' \
            http://127.0.0.1:5000/calculate \
            | python -c 'import json,sys; result=json.load(sys.stdin); assert result["estimated_1rm"] == 262.5; print("API smoke test passed")'

  
  e2e:
    name: Playwright Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Run browser tests
        run: |
          python api.py > flask.log 2>&1 &
          flask_pid=$!
          trap 'cat flask.log; kill "$flask_pid" 2>/dev/null || true' EXIT

          for attempt in {1..15}; do
            if curl --fail --silent --output /dev/null \
              http://127.0.0.1:5000/health; then
              echo "Flask is ready!"
              break
            fi

            if [ "$attempt" -eq 15 ]; then
              echo "Flask failed to start."
              exit 1
            fi

            sleep 1
          done

          python -m pytest tests/test_browser.py -v
  
  dependency_scan:
    name: Python Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
