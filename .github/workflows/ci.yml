
name: IronLog CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v
  
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Run security scan
        run: python -m bandit -r app.py
  
  
  docker:
    name: Build and Test Docker Image
    needs: [test, security]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ironlog:ci .

      - name: Test containerized API
        run: |
          docker run -d --name ironlog-ci -p 127.0.0.1:5000:5000 ironlog:ci

          trap 'docker rm -f ironlog-ci' EXIT

          curl --fail --silent --show-error \
            --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:5000/health

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"weight":225,"reps":5}' \
            http://127.0.0.1:5000/calculate \
            | python -c 'import json,sys; result=json.load(sys.stdin); assert result["estimated_1rm"] == 262.5; print("API smoke test passed")'

